global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /opt/infra/prometheus/config/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  - job_name: k8s-nodes
    static_configs:
      - targets:
          - 10.20.0.10:9100
          - 10.20.0.11:9100
          - 10.20.0.12:9100
