---
# ---------------------------------------------------------------------------
# 0. Prometheus Autoscaler Stack on Bastion
# ---------------------------------------------------------------------------
- name: Deploy Prometheus autoscaler stack on bastion
  hosts: bastion
  become: true
  tags: [autoscaler]
  roles:
    - autoscaler

- name: Deploy Grafana on bastion
  hosts: bastion
  become: true
  tags: [grafana]
  roles:
    - grafana

# ---------------------------------------------------------------------------
# 1. Kubernetes Cluster Setup
# ---------------------------------------------------------------------------
- name: Configure Kubernetes nodes (common)
  hosts: k8s_nodes
  become: true
  tags: [k8s_cluster]
  roles:
    - common

- name: Configure Kubernetes masters
  hosts: k8s_master_servers
  become: true
  tags: [k8s_cluster]
  roles:
    - master
    - clone-repo-guacamole

- name: Configure Kubernetes workers
  hosts: k8s_workers
  become: true
  tags: [k8s_cluster]
  roles:
    - worker

# ---------------------------------------------------------------------------
# 1b. Vault <-> Kubernetes integration (opt-in: --tags k8s_vault)
#     Adds the LB IP to the apiserver certSANs, regenerates the apiserver
#     cert one master at a time, then writes the Vault kubernetes-auth
#     config/role. Never runs as part of a normal site.yml pass.
# ---------------------------------------------------------------------------
- name: Wire up Vault kubernetes-auth certs on each master
  hosts: k8s_master_servers
  become: true
  serial: 1
  tags: [k8s_vault]
  tasks:
    - name: Run k8s-vault certs tasks
      ansible.builtin.include_role:
        name: k8s-vault
        tasks_from: certs.yml

- name: Configure Vault kubernetes-auth method + role
  hosts: localhost
  become: false
  tags: [k8s_vault]
  tasks:
    - name: Run k8s-vault vault_config tasks
      ansible.builtin.include_role:
        name: k8s-vault
        tasks_from: vault_config.yml

# ---------------------------------------------------------------------------
# 1. Proxmox: Configure Access on the VM
# ---------------------------------------------------------------------------
- name: Configure Access on Proxmox
  hosts: proxmox
  become: true
  gather_facts: true
  tags: [access_setup]
  tasks:
    - name: Configure VNC
      ansible.builtin.include_role:
        name: vnc_setup
      when: "'vnc' in connection_type"

    - name: Configure SSH
      ansible.builtin.include_role:
        name: ssh_setup
      when: "'ssh' in connection_type"

    - name: Configure Windows access
      ansible.builtin.include_role:
        name: win_setup
      when: "'win' in connection_type"

# ---------------------------------------------------------------------------
# 4. Localhost: Register Guacamole connection + user via API
# ---------------------------------------------------------------------------
- name: Register Guacamole connection and user
  hosts: localhost
  become: false
  tags: [guacamole_connection]
  roles:
    - guacamole_connection

# ---------------------------------------------------------------------------
# 5. Localhost: Generate and print the direct Guacamole access URL
# ---------------------------------------------------------------------------
- name: Print detailed Guacamole access information
  hosts: localhost
  become: false
  tags: [guacamole_url]
  tasks:
    - name: Run token-url script
      ansible.builtin.shell: "/home/jilani/playsoft-jilani-gharbi/playsoft-infra/scripts/token-url.sh"
      register: token_url_output

    - name: Display connection details
      debug:
        msg: "{{ token_url_output.stdout_lines }}"

