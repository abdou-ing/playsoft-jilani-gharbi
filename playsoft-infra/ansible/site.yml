---
# ---------------------------------------------------------------------------
# 0. Autoscaler brain (Alertmanager + webhook.py + worker-scaling automation)
#    stays on the bastion -- it needs the same SSH key/HCLOUD_TOKEN access the
#    bastion already has to reach masters/workers.
# ---------------------------------------------------------------------------
- name: Deploy autoscaler stack on bastion
  hosts: bastion
  become: true
  tags: [autoscaler]
  roles:
    - autoscaler

# ---------------------------------------------------------------------------
# 0b. Monitoring (Prometheus + Grafana) on its own dedicated server -- kept off
#     the bastion so it isn't affected by autoscaler/webhook changes and vice
#     versa. webhook.py pushes targets.json / the dashboard JSON here.
# ---------------------------------------------------------------------------
- name: Deploy Prometheus + Grafana on the monitoring server
  hosts: monitoring
  become: true
  tags: [monitoring, prometheus, grafana]
  roles:
    - prometheus
    - grafana

# ---------------------------------------------------------------------------
# 1. Kubernetes Cluster Setup
# ---------------------------------------------------------------------------
- name: Configure Kubernetes nodes (common)
  hosts: k8s_nodes
  become: true
  tags: [k8s_cluster]
  roles:
    - common

- name: Configure Kubernetes masters
  hosts: k8s_master_servers
  become: true
  tags: [k8s_cluster]
  roles:
    - master

- name: Configure Kubernetes workers
  hosts: k8s_workers
  become: true
  tags: [k8s_cluster]
  roles:
    - worker

# ---------------------------------------------------------------------------
# 1a. Storage (Longhorn) + secrets (External Secrets Operator) + application
#     manifests -- runs after workers have joined so their DaemonSets/
#     Deployments (no control-plane toleration) have untainted nodes to
#     schedule on.
# ---------------------------------------------------------------------------
- name: Deploy storage, secrets, and application manifests
  hosts: k8s_master_servers
  become: true
  tags: [k8s_cluster]
  roles:
    - k8s-addons

# ---------------------------------------------------------------------------
# 1b. Vault integration (opt-in: --tags k8s_vault)
#     Mints a secret_id for the workload AppRole and delivers it (+ the
#     stable role_id already baked into the SecretStore manifest) to the
#     cluster as a Kubernetes Secret. Never runs as part of a normal
#     site.yml pass.
# ---------------------------------------------------------------------------
- name: Configure Vault AppRole credentials for the guacamole-vault SecretStore
  hosts: localhost
  become: false
  tags: [k8s_vault]
  tasks:
    - name: Run k8s-vault vault_config tasks
      ansible.builtin.include_role:
        name: k8s-vault
        tasks_from: vault_config.yml

# ---------------------------------------------------------------------------
# 1c. On-demand: restore the latest S3 backup into Guacamole's postgres
#     (--tags db_restore). Standalone role, never part of a normal site.yml
#     pass -- run it manually whenever you want to (re)inject the newest
#     guacdb-*.sql.gz from guacamole-backup-dev.
# ---------------------------------------------------------------------------
- name: Restore the latest backup into Guacamole's postgres
  hosts: k8s_master_servers
  become: true
  tags: [db_restore]
  roles:
    - db-restore

# ---------------------------------------------------------------------------
# 1. Proxmox: Configure Access on the VM
# ---------------------------------------------------------------------------
- name: Configure Access on Proxmox
  hosts: proxmox
  become: true
  gather_facts: true
  tags: [access_setup]
  tasks:
    - name: Configure VNC
      ansible.builtin.include_role:
        name: vnc_setup
      when: "'vnc' in connection_type"

    - name: Configure SSH
      ansible.builtin.include_role:
        name: ssh_setup
      when: "'ssh' in connection_type"

    - name: Configure Windows access
      ansible.builtin.include_role:
        name: win_setup
      when: "'win' in connection_type"

# ---------------------------------------------------------------------------
# 4. Localhost: Register Guacamole connection + user via API
# ---------------------------------------------------------------------------
- name: Register Guacamole connection and user
  hosts: localhost
  become: false
  tags: [guacamole_connection]
  roles:
    - guacamole_connection

# ---------------------------------------------------------------------------
# 5. Localhost: Generate and print the direct Guacamole access URL
# ---------------------------------------------------------------------------
- name: Print detailed Guacamole access information
  hosts: localhost
  become: false
  tags: [guacamole_url]
  tasks:
    - name: Run token-url script
      ansible.builtin.shell: "/home/jilani/playsoft-jilani-gharbi/playsoft-infra/scripts/token-url.sh"
      register: token_url_output

    - name: Display connection details
      debug:
        msg: "{{ token_url_output.stdout_lines }}"

