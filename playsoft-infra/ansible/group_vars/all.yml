---
# ──────────────────────────────────────────────
# Shared / global variables available to all hosts
# ──────────────────────────────────────────────

_tf: "{{ lookup('file', '/home/jilani/playsoft-jilani-gharbi/playsoft-infra/terraform-hzn/tf_output.json') | from_json }}"
bastion_ip: "{{ _tf.bastion_public_ip.value }}"
k8s_master_ips: "{{ _tf.k8s_master_private_ips.value }}"
k8s_worker_ips: "{{ _tf.k8s_worker_private_ips.value }}"
k8s_lb_public_ip: "{{ _tf.load_balancer_public_ip.value }}"

# ─────────────────────────────────────────────────────────────
# Vault AppRole used both by ansible itself (bootstrap login, via
# VAULT_ROLE_ID/VAULT_SECRET_ID env vars) and by the in-cluster
# guacamole-vault SecretStore (roles/k8s-addons/templates/07-vault-secrets.yaml.j2),
# which reuses that same VAULT_SECRET_ID (delivered by --tags k8s_vault as a
# Kubernetes Secret, never committed). role_id is not itself a secret
# (Vault's AppRole security model puts the actual credential in secret_id
# only), so it's fine as a plain value here.
# ─────────────────────────────────────────────────────────────
vault_approle_role_id: "ea989d3f-4b56-2c56-5b8f-187753cb1174"  # `vault read auth/jilani-approle/role/ansible_instalab/role-id`
vault_approle_k8s_secret_name: "vault-approle-creds"

# Guacamole route name
guac_route: guacamole

# Guacamole admin credentials
auth_username: guacadmin
auth_password: guacadmin

# ─────────────────────────────────────────────────────────────
# Template config for auto-generated users.
# ─────────────────────────────────────────────────────────────
user_prefix: "ansible_user"
user_password_prefix: "alphabeta123"
user_organization: "playsoft"
user_email_domain: "jilanigharbi@example.com"

connection_prefix: "exam"
vnc_hostname: "138.201.200.168"
vnc_base_port: 5950      # port = vnc_base_port + index (1-based)
win_rdp_base_port: 3310   # port = win_rdp_base_port + index (0-based)
ssh_base_port: 2200       # port = ssh_base_port + (vmid - 200)
rdp_ignore_server_certs: true


ssh_user: "student"
ssh_password: "student"

win_user: "student"
win_password: "123456"

connection_type:
  # - "vnc"
  - "ssh"
  #- "win"

# ─────────────────────────────────────────────────────────────
# Exam node label prefix.
# The script will generate: exam_node_prefix + N (e.g. exam-rhce-node1, exam-rhce-node2)
# The number of labels is derived automatically from the Terraform VNC VM count.
# ─────────────────────────────────────────────────────────────
exam_node_prefix: "exam-rhce-node"
