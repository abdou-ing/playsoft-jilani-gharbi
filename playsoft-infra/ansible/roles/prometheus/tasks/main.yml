---
# Runs on the dedicated monitoring server. The autoscaler role (bastion) still
# owns Alertmanager + webhook.py + the worker-scaling Terraform/Ansible -- those
# stay next to the SSH key and HCLOUD_TOKEN they need. webhook.py pushes
# targets.json here after every scale event / 60s sync (see
# _push_to_monitoring in prometheus/webhook/webhook.py).

- name: Install prometheus
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: yes

- name: Create Prometheus config directory
  ansible.builtin.file:
    path: "{{ infra_dir }}/config"
    state: directory
    mode: '0755'

- name: Copy Prometheus config files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../prometheus/config/{{ item }}"
    dest: "{{ infra_dir }}/config/{{ item }}"
  loop:
    - prometheus.yml
    - alerts.yml
  notify: restart prometheus

- name: Create initial targets.json (skipped if file already exists)
  ansible.builtin.copy:
    content: "[]"
    dest: "{{ infra_dir }}/config/targets.json"
    force: false

- name: Create prometheus systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus.service.d
    state: directory
    mode: '0755'

- name: Deploy prometheus systemd override (custom config path)
  ansible.builtin.copy:
    src: prometheus-override.conf
    dest: /etc/systemd/system/prometheus.service.d/override.conf
    mode: '0644'
  notify:
    - reload systemd
    - restart prometheus

- name: Enable and start prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: yes
