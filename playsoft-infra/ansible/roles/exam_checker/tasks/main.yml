---
# ─────────────────────────────────────────────────────────────────────────────
# exam_checker/tasks/main.yml
#
# Two dispatch modes:
#   check_script defined  → upload + run the bash check script (lab1, lab2)
#   check_type defined    → inline type-based handler  (setup tasks)
# ─────────────────────────────────────────────────────────────────────────────

- name: Initialize exam results list
  set_fact:
    exam_results: []

# ── Script-based checks (lab1 / lab2) ────────────────────────────────────────
- name: Run script-based checks
  include_tasks: run_check_script.yml
  loop: "{{ exam_tasks | selectattr('check_script', 'defined') | list }}"
  loop_control:
    loop_var: exam_task
    label: "{{ exam_task.id }}"

# ── Type-based checks (setup tasks) ──────────────────────────────────────────
- name: Run ssh_auth checks
  include_tasks: q48_check_ssh_auth.yml
  loop: "{{ exam_tasks | selectattr('check_type', 'equalto', 'ssh_auth') | list }}"
  loop_control:
    loop_var: exam_task
    label: "{{ exam_task.id }}"

- name: Run ansible_cfg checks
  include_tasks: q50_check_ansible_cfg.yml
  loop: "{{ exam_tasks | selectattr('check_type', 'equalto', 'ansible_cfg') | list }}"
  loop_control:
    loop_var: exam_task
    label: "{{ exam_task.id }}"

- name: Run ansible_ping checks
  include_tasks: q51_check_ansible_ping.yml
  loop: "{{ exam_tasks | selectattr('check_type', 'equalto', 'ansible_ping') | list }}"
  loop_control:
    loop_var: exam_task
    label: "{{ exam_task.id }}"

- name: Run user_attrs checks
  include_tasks: q53_check_user_attrs.yml
  loop: "{{ exam_tasks | selectattr('check_type', 'equalto', 'user_attrs') | list }}"
