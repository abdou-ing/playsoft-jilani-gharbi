    loop_var: exam_task
    label: "{{ exam_task.id }}"

- name: Run user_absent checks
  include_tasks: q54_check_user_absent.yml
  loop: "{{ exam_tasks | selectattr('check_type', 'equalto', 'user_absent') | list }}"
  loop_control:
    loop_var: exam_task
    label: "{{ exam_task.id }}"

- name: Run service checks
  include_tasks: q55_check_service.yml
  loop: "{{ exam_tasks | selectattr('check_type', 'equalto', 'service') | list }}"
  loop_control:
    loop_var: exam_task
