- name: Run file_entry checks
  include_tasks: q56_check_file_entry.yml
  loop: "{{ exam_tasks | selectattr('check_type', 'equalto', 'file_entry') | list }}"
  loop_control:
    loop_var: exam_task
    label: "{{ exam_task.id }}"

- name: Run path checks
  include_tasks: q57_check_path.yml
  loop: "{{ exam_tasks | selectattr('check_type', 'equalto', 'path') | list }}"
  loop_control:
    loop_var: exam_task
    label: "{{ exam_task.id }}"
