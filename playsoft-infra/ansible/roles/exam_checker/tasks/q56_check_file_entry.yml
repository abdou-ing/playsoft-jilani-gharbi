---
# check_file_entry.yml — Verify content is present in a file
#
# check_args:
#   path: /etc/hosts              — file to inspect
#   hosts: all|hostname           — where to run
#   line: "10.0.0.1 myserver"     — exact string match (use this OR pattern)
#   pattern: "ansible.*NOPASSWD"  — extended regex match (use this OR line)

- name: "{{ exam_task.id }} | File entry check: {{ exam_task.check_args.path }}"
  when: >
    exam_task.check_args.hosts == 'all' or
    inventory_hostname in ([exam_task.check_args.hosts] | flatten)
  block:
    - name: "{{ exam_task.id }} | Check content in {{ exam_task.check_args.path }}"
      ansible.builtin.shell: >
        {% if exam_task.check_args.pattern is defined %}
        grep -qE "{{ exam_task.check_args.pattern }}" "{{ exam_task.check_args.path }}"
        {% else %}
        grep -qF "{{ exam_task.check_args.line }}" "{{ exam_task.check_args.path }}"
        {% endif %}
      register: _entry_check
      ignore_errors: true
      changed_when: false

    - name: "{{ exam_task.id }} | Record result"
      set_fact:
        exam_results: >-
          {{
            exam_results + [{
              'id': exam_task.id,
              'title': exam_task.title,
              'host': inventory_hostname,
              'passed': (_entry_check.rc == 0)
            }]
          }}
