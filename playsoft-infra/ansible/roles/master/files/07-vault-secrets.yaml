apiVersion: v1
kind: ServiceAccount
metadata:
  name: guacamole-vault
  namespace: guacamole

---
# Required for ESO to mint a token for guacamole-vault via the
# TokenRequest API on its behalf (serviceAccountRef below).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guacamole-vault-token
  namespace: guacamole
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["guacamole-vault"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guacamole-vault-token
  namespace: guacamole
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guacamole-vault-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: default

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: guacamole
spec:
  provider:
    vault:
      server: "https://vault.dev.playsoft.io:8200"
      path: "kv-dev"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "k8s-dev-jilani"
          role: "guacamole-k8s"   # must match the Vault role name created for this cluster
          serviceAccountRef:
            name: guacamole-vault

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: guacamole
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: postgres-secret
  data:
    - secretKey: postgres-user
      remoteRef:
        key: jilani/guacamole-k8s
        property: postgres-user
    - secretKey: postgres-password
      remoteRef:
        key: jilani/guacamole-k8s
        property: postgres-password
    - secretKey: postgres-db
      remoteRef:
        key: jilani/guacamole-k8s
        property: postgres-db

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backup-s3-secret
  namespace: guacamole
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: backup-s3-secret
  data:
    - secretKey: endpoint
      remoteRef:
        key: jilani/guacamole-backup
        property: s3-endpoint
    - secretKey: access-key
      remoteRef:
        key: jilani/guacamole-backup
        property: s3-access-key
    - secretKey: secret-key
      remoteRef:
        key: jilani/guacamole-backup
        property: s3-secret-key

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-secret
  namespace: guacamole
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: redis-secret
  data:
    - secretKey: redis-password
      remoteRef:
        key: jilani/guacamole-k8s
        property: redis-password
