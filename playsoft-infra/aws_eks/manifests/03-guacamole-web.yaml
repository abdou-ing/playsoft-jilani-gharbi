# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 1. SERVICE
# What it does: Exposes guacamole on port 30080 on every node.
# sessionAffinity: ClientIP ensures the same user always hits
# the same pod for 3 hours — without this, mid-RDP sessions
# would randomly disconnect.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
apiVersion: v1
kind: Service
metadata:
  name: guacamole-web
  namespace: guacamole
spec:
  type: NodePort
  ports:
    - port: 8080
      protocol: TCP
      nodePort: 30080
  selector:
    app: guacamole-web
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 2. POD DISRUPTION BUDGET
# What it does: Tells Kubernetes "never take down more than 1
# guacamole pod at a time." Whether it's a node drain,
# descheduler, or rolling update — only 1 pod is ever disrupted
# while the rest stay alive.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: guacamole-web-pdb
  namespace: guacamole
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: guacamole-web

---
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 3. DEPLOYMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-web
  namespace: guacamole
spec:

  # 3a. replicas + revisionHistoryLimit
  # What it does: replicas: 3 starts with 1 pod per node.
  # revisionHistoryLimit: 3 keeps only last 3 deployment versions
  # saved — prevents etcd bloat. HPA takes over after first deploy.
  replicas: 3
  revisionHistoryLimit: 3

  # 3b. strategy
  # What it does: During a deploy, Kubernetes spins up 1 new pod
  # first, waits until Ready, then kills the old one.
  # maxUnavailable: 0 means zero pods are ever down during update
  # — users never notice a deployment.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: guacamole-web

  template:
    metadata:
      labels:
        app: guacamole-web
    spec:

      # 3c. terminationGracePeriodSeconds
      # What it does: Gives the pod 40 seconds to shut down cleanly
      # before Kubernetes force-kills it. Must be higher than
      # preStop sleep (10s) + app shutdown time. Without this,
      # Kubernetes could kill the pod before it finishes shutting down.
      terminationGracePeriodSeconds: 40

      # 3d. topologySpreadConstraints
      # What it does: Tells the scheduler "the difference between
      # the most loaded node and least loaded node can never exceed
      # 1 pod." If placing a pod would break this rule, it stays
      # Pending until a valid node is available.
      # This is the LAW of even distribution.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway  
          labelSelector:
            matchLabels:
              app: guacamole-web

      # 3e. podAntiAffinity
      # What it does: Tells the scheduler "try hard to avoid placing
      # 2 guacamole pods on the same node." This is the SOFT HINT
      # on top of the hard law above. preferred (not required) means
      # if there is truly no other node, it will still schedule
      # — won't leave pods Pending forever.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: guacamole-web
                topologyKey: kubernetes.io/hostname

      containers:
      - name: guacamole-web

        # 3f. imagePullPolicy
        # What it does: Only pulls the image if not already on the node.
        # Prevents surprise re-pulls in production. When you push a new
        # version always use a new tag (e.g :1.5.4 not :latest)
        # otherwise nodes won't pull the update.
        image: jilanigh/guacamole:redis-v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080

        # 3g. readinessProbe
        # What it does: Tells Kubernetes "don't send user traffic to
        # this pod until it answers HTTP 200 on /guacamole."
        # Waits 15s for Tomcat to boot, then checks every 5s.
        # 3 failures in a row → pod removed from rotation.
        readinessProbe:
          httpGet:
            path: /guacamole
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3

        # 3h. livenessProbe
        # What it does: Tells Kubernetes "if this pod stops answering,
        # kill it and restart it." Catches zombie pods that appear
        # Running but are internally deadlocked. initialDelaySeconds: 30
        # must be higher than readiness — don't kill a pod still booting.
        livenessProbe:
          httpGet:
            path: /guacamole
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3

        # 3i. preStop
        # What it does: Before the pod is killed, wait 10 seconds first.
        # Gives active RDP/SSH sessions time to disconnect cleanly.
        # Without this, users get a hard cut mid-session the moment
        # a pod is evicted.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]

        env:
        - name: GUACD_HOSTNAME
          value: "guacd"
        - name: GUACD_PORT
          value: "4822"
        - name: POSTGRESQL_HOSTNAME
          value: "postgres"
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-db
        - name: POSTGRESQL_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-user
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: POSTGRESQL_ENABLED
          value: "true"
        - name: REDIS_HOSTNAME
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password

        # 3j. resources
        # What it does: requests = what Kubernetes reserves on a node
        # for this pod (also what HPA uses to calculate CPU %).
        # limits = the maximum it can consume before being throttled
        # (CPU) or killed (memory/OOMKill).
        # 768Mi gives Tomcat real headroom under concurrent sessions.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi

---
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 4. HORIZONTAL POD AUTOSCALER
# What it does: Auto-scales between 3 and 9 pods based on CPU.
# behavior controls the SPEED of scaling:
#   scaleUp:   waits 60s of sustained load  → adds max 1 pod/min
#   scaleDown: waits 5min of low load       → removes max 1 pod/5min
# This prevents panic scaling up and premature shrinking down.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: guacamole-web
  namespace: guacamole
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: guacamole-web
  minReplicas: 3
  maxReplicas: 9
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300

---
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 5. INGRESS (EKS addition -- the self-managed stack's external ALB +
# target group pointed at NodePort 30080 directly since node instance IDs
# were static; here the AWS Load Balancer Controller manages that ALB +
# target group for us instead, driven off this Ingress).
#
# target-type: instance registers each worker node's NodePort 30080 as the
# ALB target (not each pod IP), so traffic still flows through kube-proxy
# into the Service above -- meaning sessionAffinity: ClientIP still holds
# and this Service didn't need to change at all.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guacamole-web
  namespace: guacamole
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /guacamole
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guacamole-web
                port:
                  number: 8080
