# EBS-backed replacement for the self-managed stack's "longhorn-2rep"
# StorageClass -- provisioned by the aws-ebs-csi-driver addon (see
# terraform/modules/eks's aws_eks_addon.ebs_csi). 01-postgres.yaml's PVC
# references this by name.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
provisioner: ebs.csi.aws.com
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
