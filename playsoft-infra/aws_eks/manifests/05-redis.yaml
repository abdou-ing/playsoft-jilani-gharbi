# ============================================================
# Redis — shared session token store for guacamole-web pods
#
# WHY: GuacamoleSession is in-memory per pod. When a user's
# request hits a different pod, the token is not found → 403.
# Redis holds the token→username mapping so every pod can
# validate the token and reconstruct the session from PostgreSQL.
#
# HOW TO APPLY:
#   kubectl apply -f 05-redis.yaml
# ============================================================

# redis-secret is no longer defined here — it's materialized by the
# ExternalSecret in 07-vault-secrets.yaml, sourced from Vault (kv-dev/jilani/k8s).

---
# -- Service: stable DNS name "redis" inside the cluster --
# All guacamole-web pods connect to redis:6379
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: guacamole
spec:
  ports:
    - port: 6379
  selector:
    app: redis

---
# -- Deployment: single Redis pod with AOF persistence --
# AOF (Append-Only File) ensures sessions survive pod restarts.
# If the pod restarts, users stay logged in instead of being kicked.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
        # Start Redis with password + AOF persistence enabled
        command:
          - redis-server
          - --requirepass
          - $(REDIS_PASSWORD)
          - --appendonly
          - "yes"
          - --appendfsync
          - everysec
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
